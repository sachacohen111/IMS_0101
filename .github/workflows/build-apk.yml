name: Build Test APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install -D @capacitor/cli @capacitor/core @capacitor/android
          npx cap add android
          if [ -f android-template/AndroidManifest.xml ]; then
            cp android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          npx cap sync android

      - name: Build Debug Test APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ims-mobile-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
