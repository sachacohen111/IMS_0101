<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TuitionPro: Coaching Class Manager</title>
<style>
:root{--bg:#f2f5f4;--cd:#fff;--tx:#17211f;--mu:#64726f;--ac:#0f766e;--bd:#dce4e2;--ok:#15803d;--bad:#b91c1c;--wn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101615;--cd:#18211f;--tx:#e6efed;--mu:#93a5a1;--ac:#2dd4bf;--bd:#2a3836;--ok:#4ade80;--bad:#f87171;--wn:#fbbf24}}
:root[data-theme="dark"]{--bg:#101615;--cd:#18211f;--tx:#e6efed;--mu:#93a5a1;--ac:#2dd4bf;--bd:#2a3836;--ok:#4ade80;--bad:#f87171;--wn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--cd);border-bottom:1px solid var(--bd)}
header b{font-size:17px}.mu{color:var(--mu);font-size:12px}
.app{display:flex;flex-direction:column}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px;background:var(--cd);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border-color:transparent;text-align:left}
main{flex:1;min-width:0;padding:12px}
@media(min-width:860px){.app{flex-direction:row}nav{flex-direction:column;width:190px;overflow:visible;border-right:1px solid var(--bd);border-bottom:0;min-height:90vh}}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.g .c{margin:0}.g h2{margin:2px 0 0;font-size:24px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600}
input,select,button,textarea{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--cd);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.fm{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}.fm label{display:flex;flex-direction:column;font-size:12px;color:var(--mu)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}h3{margin:0 0 6px}
#ts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;overflow:auto;z-index:8}
</style></head><body>
<header><b>TuitionPro</b><input placeholder="Institute you are visiting" style="width:150px" onchange="vs=this.value;R()"><span style="flex:1"></span><select id="rl" onchange="role=this.value;R()"><option>Admin</option><option>Teacher</option><option>Parent</option></select><button onclick="th()">Theme</button></header>
<div class="app"><nav id="nv"></nav><main id="mn"></main></div><div id="ts"></div><div id="md"></div>
<script>
const $=s=>document.querySelector(s),today=new Date().toISOString().slice(0,10),inr=n=>Number(n).toLocaleString('en-IN');
const T=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}">No records yet</td></tr>`}</table></div>`;
let fi=0,FN={},pg='dash',role='Admin',q='',pv=null,ab='10-A',ad=today,xe=0,ps='Aarav',pc='Aarav',rp='All',fr='',to='',vs='',FB={};try{FB=JSON.parse(localStorage.getItem('tp_fb')||'{}')}catch(e){}
const F=(fs,b,fn)=>{const id='f'+(++fi);FN[id]=fn;return `<div class="fm" id="${id}">${fs.map(([n,l,t,o])=>`<label>${l}${o?`<select name="${n}">${o.map(v=>`<option>${v}</option>`).join('')}</select>`:`<input name="${n}" type="${t||'text'}" ${t=='date'?`value="${today}"`:''}>`}</label>`).join('')}<button class="p" onclick="sub('${id}')">${b}</button></div>`};
const sub=id=>{const o={};document.querySelectorAll('#'+id+' [name]').forEach(e=>o[e.name]=e.value);FN[id](o)};
const D={courses:[{n:'Class 10 Boards',on:1},{n:'JEE Foundation',on:1}],batches:[{n:'10-A',c:'Class 10 Boards',t:'Mehta'},{n:'JEE-1',c:'JEE Foundation',t:'Shah'}],
staff:[{n:'Admin',r:'Admin',p:'All modules',sub:''},{n:'Mehta',r:'Teacher',p:'Attendance, Marks',sub:'Maths'},{n:'Shah',r:'Teacher',p:'Attendance, Marks',sub:'Physics'},{n:'Patel',r:'Teacher',p:'Study material',sub:'Maths'}],
st:[['Aarav','10-A'],['Diya','10-A'],['Kabir','10-A'],['Meera','JEE-1'],['Rohan','JEE-1'],['Sana','JEE-1']].map(([n,b],i)=>({n,b,cl:b=='10-A'?'10':'11',par:n+' Parent',ph:'98250'+(10000+i*111),st:'Active',fee:b=='10-A'?24000:36000,ad:'2026-06-10'})),
pay:[{s:'Aarav',a:12000,d:'2026-06-10',m:'UPI',ref:'U1001'},{s:'Diya',a:24000,d:'2026-06-12',m:'Cash',ref:''},{s:'Meera',a:18000,d:'2026-07-01',m:'Bank',ref:'B554'},{s:'Rohan',a:9000,d:'2026-08-05',m:'UPI',ref:'U1130'}],
inq:[{n:'Isha Desai',ph:'9876500011',c:'JEE Foundation',src:'Walk-in',by:'Admin',fu:today,st:'New'},{n:'Yash Jain',ph:'9876500022',c:'Class 10 Boards',src:'Call',by:'Admin',fu:'2026-10-20',st:'Follow-Up'}],
att:{},ex:[{n:'Unit Test 1',b:'10-A',sub:'Maths',d:'2026-08-20',tm:'10:00',max:50,pass:17,pub:1},{n:'Unit Test 2',b:'10-A',sub:'Maths',d:'2026-09-25',tm:'10:00',max:50,pass:17,pub:1},{n:'Physics T1',b:'JEE-1',sub:'Physics',d:'2026-08-22',tm:'11:00',max:100,pass:33,pub:1},{n:'Physics T2',b:'JEE-1',sub:'Physics',d:'2026-10-03',tm:'11:00',max:100,pass:33,pub:1},{n:'Unit Test 3',b:'10-A',sub:'Maths',d:'2026-11-12',tm:'10:00',max:50,pass:17}],
mk:{0:{Aarav:41,Diya:38,Kabir:30},1:{Aarav:44,Diya:33,Kabir:18},2:{Meera:72,Rohan:60,Sana:81},3:{Meera:78,Rohan:41,Sana:84}},
sl:[{day:'Mon',tm:'16:00',b:'10-A',sub:'Maths',t:'Mehta',rm:'R1'},{day:'Mon',tm:'18:00',b:'JEE-1',sub:'Physics',t:'Shah',rm:'R2'},{day:'Tue',tm:'16:00',b:'JEE-1',sub:'Physics',t:'Shah',rm:'R2'}],
ab:[],mat:[{k:'Notes',t:'Trigonometry notes',sub:'Maths',b:'10-A',u:'trig-notes.pdf'},{k:'Video',t:'Laws of motion',sub:'Physics',b:'JEE-1',u:'https://www.youtube.com'}],ptm:[],fin:[{k:'Debit',cat:'Rent',a:30000,d:'2026-10-01',desc:'Branch rent',m:'Bank'}],audit:[],due:'2026-11-05',ann:['Diwali holidays: 8 to 12 Nov']};
['2026-10-19','2026-10-20','2026-10-21','2026-10-22'].forEach((d,i)=>{D.att[d]={};D.st.forEach(s=>D.att[d][s.n]=(s.n=='Rohan'&&i<3)||(s.n=='Kabir'&&i==1)?'A':'P')});
const S=n=>D.st.find(s=>s.n==n),paid=s=>D.pay.filter(p=>p.s==s.n).reduce((a,p)=>a+ +p.a,0),bal=s=>s.fee-paid(s),bn=()=>D.batches.map(b=>b.n),sm=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const g=p=>p>=90?'A+':p>=75?'A':p>=60?'B':p>=45?'C':p>=33?'D':'F';
const res=s=>D.ex.map((e,i)=>({e,i,m:D.mk[i]&&D.mk[i][s.n]})).filter(r=>r.e.b==s.b&&!r.e.x&&r.m!=null&&r.m!=='').map(r=>({...r,p:Math.round(r.m/r.e.max*100)}));
const ap=s=>{let t=0,p=0;for(const d in D.att){const v=D.att[d][s.n];if(v){t++;if(v=='P')p++}}return t?Math.round(p/t*100):100};
const risk=()=>D.st.filter(s=>s.st=='Active').flatMap(s=>{const r=res(s),n=r.length,o=[];if(n>1){const a=r[n-1].p,b=r[n-2].p;if(a<40&&b<40)o.push('Below 40% twice');else if(b-a>=10)o.push('Dropped '+(b-a)+' points')}if(ap(s)<75)o.push('Attendance '+ap(s)+'%');return o.length?[[s.n+' ('+s.b+')',o.join('; ')]]:[]});
const au=a=>D.audit.unshift([new Date().toLocaleString('en-IN'),role,a]),ok=b=>role!='Teacher'||(D.batches.find(x=>x.n==b)||{}).t=='Mehta';
const toast=m=>{const e=$('#ts');e.textContent=m;e.style.display='block';clearTimeout(window.tmr);window.tmr=setTimeout(()=>e.style.display='none',2800)};
const show=h=>{$('#md').innerHTML=`<div class="c" style="max-width:520px;width:92%"><div>${h}</div><p><button onclick="$('#md').style.display='none'">Close</button></p></div>`;$('#md').style.display='flex'};
const exp=r=>show('<h3>Export: copy into Excel</h3><textarea rows="10" style="width:100%">'+r.map(x=>x.join(',')).join('\n')+'</textarea>');
const rd=d=>new Date(new Date(d)-172800000).toISOString().slice(0,10),opt=(a,c)=>a.map(v=>`<option ${v==c?'selected':''}>${v}</option>`).join('');
const th=()=>{const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
const ch=v=>{const w=300,h=130;return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:420px">${[0,50,100].map(y=>`<line x1="24" x2="${w}" y1="${h-20-y*.9}" y2="${h-20-y*.9}" stroke="var(--bd)"/><text x="0" y="${h-16-y*.9}" font-size="9" fill="var(--mu)">${y}</text>`).join('')}${v.map((x,i)=>{const bw=Math.min(36,(w-34)/v.length-8),X=34+i*((w-34)/v.length),H=x.p*.9;return `<rect x="${X}" y="${h-20-H}" width="${bw}" height="${H}" rx="3" fill="var(--ac)"/><text x="${X}" y="${h-8}" font-size="8" fill="var(--mu)">${x.e.n.slice(0,9)}</text><text x="${X}" y="${h-24-H}" font-size="9" fill="var(--tx)">${x.p}%</text>`}).join('')}</svg>`};
const rem=()=>toast('Reminders queued for '+D.st.filter(s=>bal(s)>0).length+' parents (simulated)');
const rc=n=>{const l=[...D.pay].reverse().find(p=>p.s==n);l?show(`<h3>Payment receipt</h3><p>Student: ${n}<br>Date: ${l.d}<br>Amount: ₹${inr(l.a)}<br>Mode: ${l.m} ${l.ref}<br>Balance: ₹${inr(bal(S(n)))}</p>`):toast('No payment recorded yet')};
const saveAt=()=>{const r=D.att[ad]=D.att[ad]||{};document.querySelectorAll('.ats').forEach(e=>r[e.dataset.n]=e.value);au('Attendance '+ab+' '+ad);toast('Attendance saved');R()};
const saveMk=()=>{const e=D.ex[xe],r=D.mk[xe]=D.mk[xe]||{};let bad=0;document.querySelectorAll('.mki').forEach(i=>{if(i.value==='')return;if(+i.value>e.max||+i.value<0)bad++;else r[i.dataset.n]=+i.value});au('Marks entered: '+e.n);bad?toast(bad+' value(s) above max marks were not saved'):toast('Marks saved');R()};
const bio=()=>{let m=0,u=[],d=0;$('#bio').value.split('\n').forEach(l=>{const [n,dt,v]=l.split(',').map(x=>x&&x.trim());if(!n)return;if(!S(n))return u.push(n);if((D.att[dt]||{})[n])return d++;(D.att[dt]=D.att[dt]||{})[n]=v||'P';m++});au('Biometric import');show(`<h3>Import result</h3><p>Matched: ${m}<br>Duplicates skipped: ${d}<br>Unmatched: ${u.join(', ')||'none'}</p>`);R()};
const asg=(b,t,w)=>{D.ab.push([w,b,t]);au('Substitute '+t+' for '+b);$('#md').style.display='none';toast(t+' assigned. Teacher and parents of '+b+' notified (simulated)');R()};
const stl=()=>T(['Name','Class','Batch','Parent','Phone','Status',''],D.st.filter(s=>(s.n+s.b+s.cl+s.st).toLowerCase().includes(q.toLowerCase())).map(s=>[s.n,s.cl,s.b,s.par,s.ph,`<select onchange="S('${s.n}').st=this.value;au('Status ${s.n}: '+this.value)">${opt(['Admission','Active','Inactive','Leaving'],s.st)}</select>`,`<button onclick="pv='${s.n}';R()">Profile</button>`]));
const prof=s=>`<div class="c"><h3>${s.n}, ${s.b} (${s.st})</h3><p>Parent: ${s.par}, ${s.ph}. Admitted ${s.ad}.</p><p>Fees ₹${inr(s.fee)}, paid ₹${inr(paid(s))}, <b class="${bal(s)?'bad':'ok'}">₹${inr(bal(s))} pending</b>. Attendance ${ap(s)}%.</p>${T(['Exam','Marks','Percent','Grade'],res(s).map(x=>[x.e.n,x.m+'/'+x.e.max,x.p+'%',g(x.p)]))}<button onclick="pv=null;R()">Close profile</button></div>`;
const P={
dash:()=>{const ar=risk();return `<div class="g">${[['Active students',D.st.filter(s=>s.st=='Active').length],['Fees pending','₹'+inr(sm(D.st,bal))],['Follow-ups due',D.inq.filter(i=>!['Admitted','Lost'].includes(i.st)&&i.fu<=today).length],['At-risk students',ar.length]].map(([l,v])=>`<div class="c"><span class="mu">${l}</span><h2>${v}</h2></div>`).join('')}</div><div class="c"><h3>Overdue fees</h3>${T(['Student','Balance'],D.st.filter(s=>bal(s)>0).map(s=>[s.n,'₹'+inr(bal(s))]))}</div><div class="c"><h3>At-risk students</h3>${T(['Student','Reason'],ar)}</div><div class="c"><h3>Upcoming exams</h3>${T(['Exam','Batch','Date'],D.ex.filter(e=>!e.x&&e.d>=today).map(e=>[e.n,e.b,e.d]))}</div>`},
stu:()=>`${pv?prof(S(pv)):''}<div class="c"><h3>Register student</h3>${F([['n','Name'],['cl','Class'],['b','Batch','',bn()],['par','Parent or guardian'],['ph','Phone'],['fee','Total fee','number']],'Add student',o=>{if(!o.n)return toast('Enter the student name');D.st.push({n:o.n,b:o.b,cl:o.cl,par:o.par,ph:o.ph,st:'Admission',fee:+o.fee||0,ad:today});au('Added student '+o.n);R()})}</div><div class="c"><input placeholder="Search name, class, batch or status" value="${q}" oninput="q=this.value;$('#lst').innerHTML=stl()"><div id="lst">${stl()}</div></div>`,
inq:()=>{const adm=D.inq.filter(i=>i.st=='Admitted').length;return `<div class="c"><h3>New inquiry</h3>${F([['n','Student or parent'],['ph','Phone'],['c','Course','',D.courses.map(c=>c.n)],['src','Source','',['Call','Walk-in','Website','Other']],['by','Assigned to','',D.staff.map(s=>s.n)],['fu','Follow-up','date']],'Add inquiry',o=>{if(!o.n)return toast('Enter a name');D.inq.push({...o,st:'New'});au('Inquiry '+o.n);R()})}</div><div class="c"><h3>Pipeline</h3><p class="mu">Conversion ${D.inq.length?Math.round(adm/D.inq.length*100):0}%. Pending follow-ups: ${D.inq.filter(i=>!['Admitted','Lost'].includes(i.st)&&i.fu<=today).length}</p>${T(['Name','Phone','Course','Source','Staff','Follow-up','Status'],D.inq.map((i,k)=>[i.n,i.ph,i.c,i.src,i.by,`<input type="date" value="${i.fu}" onchange="D.inq[${k}].fu=this.value;R()">`,`<select onchange="D.inq[${k}].st=this.value;au('Inquiry status: ${i.n}');R()">${opt(['New','Contacted','Demo Scheduled','Follow-Up','Admitted','Lost'],i.st)}</select>`]))}</div>`},
fee:()=>{const mo={};D.pay.forEach(p=>mo[p.d.slice(0,7)]=(mo[p.d.slice(0,7)]||0)+ +p.a);return `<div class="c"><h3>Record payment</h3>${F([['s','Student','',D.st.map(s=>s.n)],['a','Amount','number'],['m','Mode','',['Cash','UPI','Card','Bank']],['ref','Reference no.']],'Save payment',o=>{if(!+o.a)return toast('Enter the amount');D.pay.push({s:o.s,a:+o.a,d:today,m:o.m,ref:o.ref});au('Payment ₹'+o.a+' from '+o.s);R()})}</div><div class="c"><h3>Reminders</h3>Due date <input type="date" value="${D.due}" onchange="D.due=this.value"> <button onclick="rem()">Remind parents with pending fees</button></div><div class="c"><h3>Fee status</h3>${T(['Student','Total (editable)','Paid','Balance','Status','',''],D.st.map(s=>[s.n,`<input type="number" value="${s.fee}" style="width:90px" onchange="S('${s.n}').fee=+this.value;au('Fee edited: ${s.n}');R()">`,'₹'+inr(paid(s)),'₹'+inr(bal(s)),bal(s)<=0?'<span class="ok">Paid</span>':today>D.due?'<span class="bad">Overdue</span>':paid(s)?'<span class="wn">Partial</span>':'<span class="wn">Unpaid</span>',`<button onclick="rc('${s.n}')">Receipt</button>`,`<button onclick="toast('Reminder sent to ${s.par} (simulated)')">Remind</button>`]))}</div><div class="c"><h3>Batch-wise and monthly</h3>${T(['Batch','Billed','Collected','Pending'],D.batches.map(b=>{const l=D.st.filter(s=>s.b==b.n);return [b.n,'₹'+inr(sm(l,s=>s.fee)),'₹'+inr(sm(l,paid)),'₹'+inr(sm(l,bal))]}))}${T(['Month','Collected'],Object.entries(mo).map(([k,v])=>[k,'₹'+inr(v)]))}</div><div class="c"><h3>Payment history</h3>${T(['Date','Student','Amount','Mode','Reference'],[...D.pay].reverse().map(p=>[p.d,p.s,'₹'+inr(p.a),p.m,p.ref||'-']))}</div>`},
att:()=>{const L=D.st.filter(s=>s.b==ab),rec=D.att[ad]||{},mo=ad.slice(0,7);return `<div class="c"><h3>Mark attendance</h3><select onchange="ab=this.value;R()">${opt(bn().filter(ok),ab)}</select> <input type="date" value="${ad}" onchange="ad=this.value;R()">${T(['Student','Status (P present, A absent, L leave)'],L.map(s=>[s.n,`<select class="ats" data-n="${s.n}">${opt(['P','A','L'],rec[s.n]||'P')}</select>`]))}<p><button class="p" onclick="saveAt()">Save attendance</button> Corrections are logged in the audit history.</p></div><div class="c"><h3>Monthly sheet, ${mo}</h3>${T(['Student','Present','Absent','Leave','Percent'],L.map(s=>{const v=Object.keys(D.att).filter(d=>d.startsWith(mo)).map(d=>D.att[d][s.n]).filter(Boolean),c=x=>v.filter(y=>y==x).length;return [s.n,c('P'),c('A'),c('L'),v.length?Math.round(c('P')/v.length*100)+'%':'-']}))}<button onclick="exp([['Student','Date','Status'],...Object.keys(D.att).filter(d=>d.startsWith('${mo}')).flatMap(d=>L.map(s=>[s.n,d,D.att[d][s.n]||'']))].map(r=>r))">Export sheet</button></div><div class="c"><h3>Biometric import</h3><p class="mu">Paste device export as Name,Date,Status. Manual attendance stays available as fallback. Live device sync depends on the device.</p><textarea id="bio" rows="3" style="width:100%" placeholder="Aarav,${today},P"></textarea><button onclick="bio()">Import and check</button></div>`},
tb:()=>`<div class="c"><h3>Add class slot</h3>${F([['day','Day','',['Mon','Tue','Wed','Thu','Fri','Sat']],['tm','Time','time'],['b','Batch','',bn()],['sub','Subject'],['t','Teacher','',D.staff.filter(s=>s.r=='Teacher').map(s=>s.n)],['rm','Room']],'Add slot',o=>{const c=D.sl.find(x=>x.day==o.day&&x.tm==o.tm&&(x.t==o.t||x.b==o.b||x.rm==o.rm));if(c)return toast('Conflict: '+(c.t==o.t?'teacher':c.b==o.b?'batch':'room')+' already booked at that time');D.sl.push(o);au('Slot '+o.b+' '+o.day);toast('Slot added. Affected users notified (simulated)');R()})}</div><div class="c"><h3>Weekly timetable</h3>${T(['Day','Time','Batch','Subject','Teacher','Room'],[...D.sl].sort((a,b)=>['Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(a.day)-['Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(b.day)||a.tm.localeCompare(b.tm)).map(x=>[x.day,x.tm,x.b,x.sub,x.t,x.rm]))}</div><div class="c"><h3>Teacher absent</h3>${F([['t','Teacher','',D.staff.filter(s=>s.r=='Teacher').map(s=>s.n)],['day','Day','',['Mon','Tue','Wed','Thu','Fri','Sat']],['tm','Time','time']],'Find substitutes',o=>{const a=D.sl.filter(x=>x.t==o.t&&x.day==o.day&&x.tm==o.tm);if(!a.length)return toast('No class for that teacher in this slot');show(`<h3>Affected classes</h3>${T(['Batch','Subject'],a.map(x=>[x.b,x.sub]))}<h3>Available substitutes</h3>`+D.staff.filter(s=>s.r=='Teacher'&&s.n!=o.t&&!D.sl.some(x=>x.t==s.n&&x.day==o.day&&x.tm==o.tm)).sort((x,y)=>(y.sub==a[0].sub)-(x.sub==a[0].sub)).map(s=>`<p>${s.n} (${s.sub}) <button onclick="asg('${a[0].b}','${s.n}','${o.day} ${o.tm}')">Assign</button></p>`).join(''))})}${T(['Slot','Batch','Substitute'],D.ab)}</div>`,
ex:()=>`<div class="c"><h3>Schedule exam</h3>${F([['n','Exam'],['b','Batch','',bn()],['sub','Subject'],['d','Date','date'],['tm','Time','time'],['max','Max marks','number'],['pass','Pass marks','number']],'Schedule exam',o=>{if(!o.n)return toast('Enter the exam name');D.ex.push({...o,max:+o.max||100,pass:+o.pass||33});au('Exam '+o.n);toast('Students and parents notified (simulated)');R()})}</div><div class="c">${T(['Exam','Batch','Subject','When','Max/Pass','Reminder','Status',''],D.ex.map((e,i)=>[e.n,e.b,e.sub,e.d+' '+(e.tm||''),e.max+'/'+e.pass,rd(e.d),e.x?'Cancelled':e.d<today?'Done':'Scheduled',e.x?'':`<button onclick="D.ex[${i}].x=1;au('Exam cancelled');toast('Cancellation notified (simulated)');R()">Cancel</button>`]))}</div>`,
mk:()=>{const e=D.ex[xe],L=D.st.filter(s=>s.b==e.b),m=D.mk[xe]||{},rk=[...L].filter(s=>m[s.n]!=null).sort((a,b)=>m[b.n]-m[a.n]);return `<div class="c"><h3>Marks entry</h3><select onchange="xe=+this.value;R()">${D.ex.map((x,i)=>ok(x.b)?`<option value="${i}" ${i==xe?'selected':''}>${x.n} (${x.b})</option>`:'').join('')}</select> <span class="mu">Max ${e.max}, pass ${e.pass}. Missing: ${L.filter(s=>m[s.n]==null).length}</span>${T(['Student','Marks'],L.map(s=>[s.n,`<input class="mki" data-n="${s.n}" type="number" style="width:80px" value="${m[s.n]??''}">`]))}<button class="p" onclick="saveMk()">Save marks</button></div><div class="c"><h3>Result, ${e.n}</h3>${T(['Rank','Student','Marks','Percent','Grade','Result'],rk.map((s,i)=>[i+1,s.n,m[s.n]+'/'+e.max,Math.round(m[s.n]/e.max*100)+'%',g(m[s.n]/e.max*100),m[s.n]>=e.pass?'<span class="ok">Pass</span>':'<span class="bad">Fail</span>']))}<p>Status: ${e.pub?'<b class="ok">Published</b>':'Not published'} ${role=='Admin'?`<button onclick="D.ex[${xe}].pub=!D.ex[${xe}].pub;toast(D.ex[${xe}].pub?'Published. Parents notified (simulated)':'Unpublished');au('Result publish toggled');R()">${e.pub?'Unpublish':'Publish result'}</button>`:'(Admin approves publishing)'}</p></div>`},
pf:()=>{const s=S(ps),r=res(s),v=rp=='Last 4'?r.slice(-4):r,n=r.length;return `<div class="c"><h3>Student progress</h3><select onchange="ps=this.value;R()">${opt(D.st.map(x=>x.n),ps)}</select> <select onchange="rp=this.value;R()">${opt(['All','Last 4'],rp)}</select>${ch(v)}<p>${n>1?`Current ${r[n-1].p}% versus previous ${r[n-2].p}%: <b class="${r[n-1].p<r[n-2].p?'bad':'ok'}">${r[n-1].p>=r[n-2].p?'+':''}${r[n-1].p-r[n-2].p} points</b>`:'Not enough results yet'}</p></div><div class="c"><h3>Batch summary (staff only)</h3>${T(['Exam','Batch','Average','Highest','Lowest'],D.ex.map((e,i)=>{const v=Object.values(D.mk[i]||{});return v.length?[e.n,e.b,Math.round(sm(v,x=>x)/v.length/e.max*100)+'%',Math.max(...v),Math.min(...v)]:null}).filter(Boolean))}<p class="mu">Individual results are visible only to staff and that student’s parent.</p></div>`},
mat:()=>`<div class="c"><h3>Add material</h3>${F([['k','Type','',['Notes','Worksheet','Video']],['t','Title'],['sub','Subject'],['b','Batch','',bn()],['u','File name or link']],'Add material',o=>{if(!o.t)return toast('Enter a title');D.mat.push(o);au('Material '+o.t);toast('Students notified (simulated)');R()})}<p class="mu">File storage is not connected in this prototype. Add a file name or a link; videos use YouTube links.</p></div><div class="c">${T(['Type','Title','Subject','Batch','Open',''],D.mat.map((m,i)=>[m.k,m.t,m.sub,m.b,/^https?:/.test(m.u)?`<a href="${m.u}" target="_blank" rel="noopener">Open</a>`:m.u,`<button onclick="D.mat.splice(${i},1);R()">Delete</button>`]))}</div>`,
crs:()=>`<div class="c"><h3>Courses</h3>${F([['n','Course name']],'Add course',o=>{if(!o.n)return;D.courses.push({n:o.n,on:1});au('Course '+o.n);R()})}${T(['Course','Status',''],D.courses.map((c,i)=>[c.n,c.on?'Active':'Inactive',`<button onclick="D.courses[${i}].on=!D.courses[${i}].on;R()">${c.on?'Deactivate':'Activate'}</button>`]))}</div><div class="c"><h3>Batches</h3>${F([['n','Batch name'],['c','Course','',D.courses.filter(c=>c.on).map(c=>c.n)],['t','Teacher','',D.staff.filter(s=>s.r=='Teacher').map(s=>s.n)]],'Add batch',o=>{if(!o.n)return;D.batches.push(o);au('Batch '+o.n);R()})}${T(['Batch','Course','Teacher','Students'],D.batches.map(b=>[b.n,b.c,b.t,D.st.filter(s=>s.b==b.n).length]))}</div>`,
ptm:()=>`<div class="c"><h3>Schedule parent-teacher meeting</h3>${F([['d','Date','date'],['tm','Time','time'],['loc','Location or mode'],['b','Batch','',['All',...bn()]]],'Schedule PTM',o=>{D.ptm.push(o);au('PTM '+o.b);toast('Parents and teachers notified (simulated)');R()})}${T(['Date','Time','Where','Batch',''],D.ptm.map((p,i)=>[p.d,p.tm,p.loc,p.b,`<button onclick="D.ptm.splice(${i},1);toast('Cancellation notified (simulated)');R()">Cancel</button>`]))}</div>`,
fin:()=>{const f=[...D.fin,...D.pay.map(p=>({k:'Credit',cat:'Student fees',a:p.a,d:p.d,desc:p.s,m:p.m}))].filter(x=>(!fr||x.d>=fr)&&(!to||x.d<=to)).sort((a,b)=>b.d.localeCompare(a.d)),fe=sm(f.filter(x=>x.cat=='Student fees'),x=>+x.a),oc=sm(f.filter(x=>x.k=='Credit'&&x.cat!='Student fees'),x=>+x.a),db=sm(f.filter(x=>x.k=='Debit'),x=>+x.a);return `<div class="c"><h3>Add entry</h3>${F([['k','Type','',['Debit','Credit']],['cat','Category','',['Rent','Salaries','Utilities','Stationery','Other']],['a','Amount','number'],['d','Date','date'],['desc','Description'],['m','Mode','',['Cash','UPI','Bank']]],'Add entry',o=>{if(!+o.a)return toast('Enter the amount');D.fin.push({...o,a:+o.a});au('Finance entry ₹'+o.a);R()})}</div><div class="c">From <input type="date" value="${fr}" onchange="fr=this.value;R()"> to <input type="date" value="${to}" onchange="to=this.value;R()"></div><div class="g"><div class="c"><span class="mu">Fee collections</span><h2>₹${inr(fe)}</h2></div><div class="c"><span class="mu">Other credits</span><h2>₹${inr(oc)}</h2></div><div class="c"><span class="mu">Expenses</span><h2>₹${inr(db)}</h2></div><div class="c"><span class="mu">Net operating balance</span><h2>₹${inr(fe+oc-db)}</h2></div></div><div class="c">${T(['Date','Type','Category','Description','Mode','Amount'],f.map(x=>[x.d,x.k,x.cat,x.desc||'',x.m,'₹'+inr(x.a)]))}<button onclick="exp([['Date','Type','Category','Description','Amount'],...${JSON.stringify(f.map(x=>[x.d,x.k,x.cat,String(x.desc||'').replace(/,/g,' '),x.a]))}])">Export report</button><p class="mu">Net operating balance is cash in minus cash out for the period. It is not audited profit.</p></div>`},
usr:()=>`<div class="c"><h3>Staff accounts and permissions</h3>${F([['n','Name'],['r','Role','',['Teacher','Admin']],['p','Permitted modules'],['sub','Subject']],'Create account',o=>{if(!o.n)return;D.staff.push(o);au('Account '+o.n);R()})}${T(['Name','Role','Modules','Subject'],D.staff.map(s=>[s.n,s.r,s.p,s.sub||'-']))}<p class="mu">Use the role switcher at the top to see Admin, Teacher (assigned batches only) and Parent views.</p></div><div class="c"><h3>Audit history</h3>${T(['Time','User role','Change'],D.audit.slice(0,30))}</div><div class="c"><h3>Security and backup</h3><p class="mu">Planned for the live product: secure login, per-institute data isolation, daily backups with a recovery process, encrypted file access, and defined data retention and deletion. This prototype stores nothing.</p></div>`,
por:()=>{const s=S(pc),pr=res(s).filter(x=>D.ex[x.i].pub);return `<div class="c"><h3>Parent portal</h3>Child <select onchange="pc=this.value;R()">${opt(D.st.map(x=>x.n),pc)}</select><div class="g" style="margin-top:10px"><div class="c"><span class="mu">Attendance</span><h2>${ap(s)}%</h2></div><div class="c"><span class="mu">Fee balance</span><h2>₹${inr(bal(s))}</h2></div></div>${bal(s)>0?`<p class="wn">Fee due by ${D.due}</p>`:''}</div><div class="c"><h3>Published results</h3>${T(['Exam','Marks','Percent'],pr.map(x=>[x.e.n,x.m+'/'+x.e.max,x.p+'%']))}${ch(pr)}</div><div class="c"><h3>Upcoming exams and timetable</h3>${T(['Exam','Date'],D.ex.filter(e=>e.b==s.b&&!e.x&&e.d>=today).map(e=>[e.n,e.d+' '+e.tm]))}${T(['Day','Time','Subject'],D.sl.filter(x=>x.b==s.b).map(x=>[x.day,x.tm,x.sub]))}</div><div class="c"><h3>Receipts and material</h3>${T(['Date','Amount','Mode'],D.pay.filter(p=>p.s==s.n).map(p=>[p.d,'₹'+inr(p.a),p.m]))}${T(['Type','Title','Open'],D.mat.filter(m=>m.b==s.b).map(m=>[m.k,m.t,/^https?:/.test(m.u)?`<a href="${m.u}" target="_blank" rel="noopener">Open</a>`:m.u]))}</div><div class="c"><h3>Announcements and PTM</h3>${D.ann.map(a=>`<p>${a}</p>`).join('')}${T(['Date','Time','Where'],D.ptm.filter(p=>p.b=='All'||p.b==s.b).map(p=>[p.d,p.tm,p.loc]))}</div>`}};
const LS=()=>{try{localStorage.setItem('tp_fb',JSON.stringify(FB))}catch(e){}},kn=()=>vs||'Unnamed institute',kr=()=>FB[kn()]||{m:{}},fk=()=>(FB[kn()]=FB[kn()]||{m:{},price:'',pain:''}),qe=s=>String(s||'').replace(/"/g,'&quot;');
const sf=(v,n)=>{const k=fk(),m=k.m[pg]=k.m[pg]||{};if(v)m.r=v;if(n!=null)m.n=n;LS();if(v){toast('Saved: '+v);R()}};
const fbar=()=>{const m=kr().m[pg]||{};return `<div class="c" style="border-color:var(--ac)"><h3>Demo feedback for this screen</h3><div class="fm">${['Must have','Nice to have','Not needed'].map(v=>`<button class="${m.r==v?'p':''}" onclick="sf('${v}')">${v}</button>`).join('')}</div><input placeholder="Owner’s comment on this screen" style="width:100%" value="${qe(m.n)}" onchange="sf(null,this.value)"></div>`};
P.fbk=()=>{const k=kr(),sc=NAV.filter(n=>n[0]!='fbk'),cnt=(id,r)=>Object.values(FB).filter(x=>(x.m[id]||{}).r==r).length;return `<div class="c"><h3>Visit details: ${qe(kn())}</h3><div class="fm"><label>Monthly price they would pay (₹)<input type="number" value="${qe(k.price)}" onchange="fk().price=this.value;LS()"></label><label>Number of students<input type="number" value="${qe(k.sz)}" onchange="fk().sz=this.value;LS()"></label><label>Pilot batch and start date<input value="${qe(k.pilot)}" onchange="fk().pilot=this.value;LS()"></label></div><label class="mu">Biggest pain, in their words</label><input style="width:100%" value="${qe(k.pain)}" onchange="fk().pain=this.value;LS()"></div><div class="c"><h3>This visit: screen ratings</h3>${T(['Screen','Rating','Comment'],sc.map(n=>{const m=k.m[n[0]]||{};return [n[1],m.r||'-',m.n||'']}))}</div><div class="c"><h3>All visits</h3>${T(['Screen','Must have','Nice to have','Not needed'],sc.map(n=>[n[1],cnt(n[0],'Must have'),cnt(n[0],'Nice to have'),cnt(n[0],'Not needed')]))}${T(['Institute','Price','Students','Pilot','Pain'],Object.entries(FB).map(([a,x])=>[a,x.price||'-',x.sz||'-',x.pilot||'-',x.pain||'-']))}<button onclick="exp([['Institute','Price','Students','Pilot','Pain'],...Object.entries(FB).map(([a,x])=>[a,x.price||'',x.sz||'',String(x.pilot||'').replace(/,/g,' '),String(x.pain||'').replace(/,/g,' ')])])">Export summary</button><p class="mu">Ratings are saved in this browser only. Export after each visit.</p></div>`};
const NAV=[['dash','Dashboard'],['stu','Students'],['inq','Inquiries'],['fee','Fees'],['att','Attendance'],['tb','Timetable'],['ex','Exams'],['mk','Marks and results'],['pf','Progress'],['mat','Study material'],['crs','Courses and batches'],['ptm','PTM'],['fin','Finance'],['usr','Users and audit'],['por','Parent portal'],['fbk','Feedback summary']];
const AL={Admin:NAV.map(n=>n[0]),Teacher:['att','tb','ex','mk','pf','mat'],Parent:['por']};
function R(){fi=0;FN={};const a=AL[role];if(!a.includes(pg))pg=a[0];$('#nv').innerHTML=NAV.filter(n=>a.includes(n[0])).map(n=>`<button class="${n[0]==pg?'p':''}" onclick="pg='${n[0]}';pv=null;R()">${n[1]}</button>`).join('');$('#mn').innerHTML=P[pg]()+(pg=='fbk'?'':fbar())}
R();
</script></body></html>
